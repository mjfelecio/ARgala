ace-xs":"0.25rem","margin-lg":"1.5rem","space-lg":"1.5rem","gutter-sm":"0.75rem","margin":"1rem","space-md":"1rem","space-sm":"0.5rem","gutter":"1rem","space-xl":"2rem"},fontFamily:{"headline-xl-mobile":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"headline-sm":["Plus Jakarta Sans"],"headline-xl":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"label-lg":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"]},fontSize:{"headline-xl-mobile":["28px",{"lineHeight":"34px","fontWeight":"700"}],"headline-lg":["24px",{"lineHeight":"32px","fontWeight":"700"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"headline-sm":["16px",{"lineHeight":"22px","fontWeight":"600"}],"headline-xl":["36px",{"lineHeight":"44px","fontWeight":"700"}],"label-md":["12px",{"lineHeight":"16px","fontWeight":"600"}],"headline-md":["20px",{"lineHeight":"26px","fontWeight":"600"}],"body-sm":["12px",{"lineHeight":"16px","fontWeight":"500"}],"label-sm":["10px",{"lineHeight":"14px","fontWeight":"700"}],"label-lg":["14px",{"lineHeight":"20px","fontWeight":"600"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}]}}}}</script></head><body class="min-h-screen bg-surface text-on-surface antialiased flex flex-col relative select-none"><header class="fixed top-0 inset-x-0 z-50 pointer-events-none pt-safe"><div class="h-12 px-margin flex items-center justify-between text-white/90 text-label-md font-label-md drop-shadow-[0_1px_2px_rgba(0,0,0,0.4)]"><span class="tracking-tight font-medium">9:41</span><div class="flex items-center gap-space-xs"><span class="material-symbols-outlined text-[16px]">wifi</span><span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span><span class="material-symbols-outlined text-[16px]">battery_full</span></div></div></header><main class="flex-1 flex flex-col w-full relative min-h-screen bg-surface"><div class="flex flex-col w-full relative">
<!-- Top Visual & Storytelling Hero (~42vh) -->
<div class="relative w-full h-[42vh] flex flex-col items-center justify-center overflow-hidden"><div class="absolute inset-0 bg-cover bg-center w-full h-full scale-105 transform" data-alt="A serene panoramic landscape photograph of Lake Danao in Leyte, Philippines. A lush, tranquil guitar-shaped volcanic lake surrounded by verdant green rainforest mountains and hills, misty peaks in the distance, calm reflective emerald water, wooden bangka boats gently floating near the lake shore, clear soft daylight sky." style="background-image: url(&quot;https://lh3.googleusercontent.com/aida-public/AB6AXuDksc5ANu-jfyAj0gNyHmR8iiQcqZn7iU8TLrsYPUrntk2WM9vxZcbK6z8EFdzMWW0dI6fy2liIQan0hjvUpZLYysr1jGYvdjwd2qW8u49ylKG84iQJ22XCTI0EUmCB47gxgUVm0LxqxXFsHGz1yMBFj5UKU5o15Ix8vz4rGQsvwB0npeSmVQze3UlL39i7d3qwtThk21t2CkqEuU4G-hCMWZJpen1n-42sMTz4O98y9yAej2Ma8qCg&quot;);"></div><div class="absolute inset-0 bg-gradient-to-b from-black/50 via-transparent to-black/60 pointer-events-none"></div><div class="relative z-10 px-margin flex flex-col items-center text-center -mt-2"><div class="relative flex items-center justify-center mb-2"><div class="w-12 h-12 rounded-2xl bg-surface-container-lowest/90 backdrop-blur-md shadow-lg flex items-center justify-center"><span class="material-symbols-outlined text-primary-container text-[28px]" style="font-variation-settings: 'FILL' 1;">view_in_ar</span></div></div><h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-primary tracking-tight drop-shadow-md font-bold">ARgala</h1><p class="font-body-md text-body-md text-on-primary/95 mt-1 max-w-[280px] drop-shadow font-medium">Discover places around you.</p></div></div>
<!-- Bottom Interactive Sheet (~58vh) Seamlessly Docked -->
<div class="relative z-20 -mt-6 bg-surface-container-lowest rounded-t-[32px] px-margin pt-6 pb-10 flex flex-col shadow-2xl flex-1">
<!-- Sheet Drag Handle Accent -->
<div class="w-10 h-1 bg-surface-container-highest rounded-full mx-auto mb-5"></div>
<!-- Section Header -->
<div class="flex flex-col mb-5">
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight">
        Choose your language
      </h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-0.5">
        Select your preferred language to begin exploring.
      </p>
</div>
<!-- Language Selection List (No national flags, respectful CJK glyph rendering) -->
<div aria-label="Select app language" class="flex flex-col gap-3" id="language-group" role="radiogroup">
<!-- Option 1: English (Selected Default) -->
<button aria-checked="true" class="lang-option w-full min-h-[66px] px-4 py-3 rounded-2xl bg-secondary-container/40 flex items-center justify-between text-left transition-all active:scale-[0.99] shadow-sm" data-lang="en" role="radio" type="button">
<div class="flex flex-col">
<div class="flex items-center gap-2">
<span class="font-headline-sm text-headline-sm text-on-secondary-fixed-variant">English</span>
<span class="font-label-sm text-label-sm bg-primary-container text-on-primary px-2 py-0.5 rounded-full">Default</span>
</div>
<span class="font-body-sm text-body-sm text-on-secondary-container mt-0.5">English (US)</span>
</div>
<div class="lang-radio-indicator w-6 h-6 rounded-full bg-primary-container flex items-center justify-center text-on-primary shadow-sm shrink-0">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</button>
<!-- Option 2: Korean -->
<button aria-checked="false" class="lang-option w-full min-h-[66px] px-4 py-3 rounded-2xl bg-surface-container-low flex items-center justify-between text-left transition-all active:scale-[0.99]" data-lang="ko" role="radio" type="button">
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">한국어</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Korean</span>
</div>
<div class="lang-radio-indicator w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-transparent shrink-0">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</button>
<!-- Option 3: Japanese -->
<button aria-checked="false" class="lang-option w-full min-h-[66px] px-4 py-3 rounded-2xl bg-surface-container-low flex items-center justify-between text-left transition-all active:scale-[0.99]" data-lang="ja" role="radio" type="button">
<div class="flex flex-col">
<span class="font-headline-sm text-headline-sm text-on-surface">日本語</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Japanese</span>
</div>
<div class="lang-radio-indicator w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center text-transparent shrink-0">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</button>
</div>
<!-- Quick Outdoor Feature Strip (Delight Cue) -->

<!-- Primary Action & Subtle Setting Disclaimer -->
<div class="mt-6 flex flex-col items-center">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-md transition-all active:bg-primary active:scale-[0.99]" id="continue-button" type="button">
<span class="">Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="font-body-sm text-body-sm text-on-surface-variant/80 text-center mt-3 flex items-center gap-1 justify-center">
<span class="material-symbols-outlined text-[14px]">tune</span>
<span class="">You can change your language anytime in Settings.</span>
</p>
</div>
</div>
</div>
<script>
  (function() {
    const options = document.querySelectorAll('.lang-option');
    const continueBtn = document.getElementById('continue-button');

    const i18nTitles = {
      en: { btn: 'Continue', hint: 'You can change your language anytime in Settings.' },
      ko: { btn: '계속하기', hint: '설정에서 언제든지 언어를 변경할 수 있습니다.' },
      ja: { btn: '次へ進む', hint: '言語はいつでも「設定」から変更できます。' }
    };

    options.forEach(option => {
      option.addEventListener('click', () => {
        // Clear all states
        options.forEach(opt => {
          opt.setAttribute('aria-checked', 'false');
          opt.classList.remove('bg-secondary-container/40', 'shadow-sm');
          opt.classList.add('bg-surface-container-low');

          const title = opt.querySelector('.font-headline-sm');
          const subtitle = opt.querySelector('.font-body-sm');
          const indicator = opt.querySelector('.lang-radio-indicator');

          title.classList.remove('text-on-secondary-fixed-variant');
          title.classList.add('text-on-surface');

          subtitle.classList.remove('text-on-secondary-container');
          subtitle.classList.add('text-on-surface-variant');

          indicator.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-sm');
          indicator.classList.add('bg-surface-container-highest', 'text-transparent');
        });

        // Set active state
        option.setAttribute('aria-checked', 'true');
        option.classList.remove('bg-surface-container-low');
        option.classList.add('bg-secondary-container/40', 'shadow-sm');

        const activeTitle = option.querySelector('.font-headline-sm');
        const activeSubtitle = option.querySelector('.font-body-sm');
        const activeIndicator = option.querySelector('.lang-radio-indicator');

        activeTitle.classList.remove('text-on-surface');
        activeTitle.classList.add('text-on-secondary-fixed-variant');

        activeSubtitle.classList.remove('text-on-surface-variant');
        activeSubtitle.classList.add('text-on-secondary-container');

        activeIndicator.classList.remove('bg-surface-container-highest', 'text-transparent');
        activeIndicator.classList.add('bg-primary-container', 'text-on-primary', 'shadow-sm');

        // Tactile CTA text translation feedback
        const lang = option.getAttribute('data-lang');
        if (i18nTitles[lang] && continueBtn) {
          const btnSpan = continueBtn.querySelector('span:first-child');
          if (btnSpan) btnSpan.textContent = i18nTitles[lang].btn;
        }
      });
    });
  })();
</script></main><footer class="fixed bottom-0 inset-x-0 z-50 pointer-events-none pb-safe flex justify-center items-center"><div class="w-32 h-1 mb-2 bg-on-surface/20 rounded-full"></div></footer>

</body></html>

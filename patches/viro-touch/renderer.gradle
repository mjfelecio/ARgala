import groovy.json.JsonSlurper
import java.security.MessageDigest
import java.util.zip.ZipFile
import org.objectweb.asm.ClassVisitor
import org.objectweb.asm.MethodVisitor
import org.objectweb.asm.ClassReader
import org.objectweb.asm.ClassWriter
import org.objectweb.asm.Label
import org.objectweb.asm.Opcodes

buildscript {
    repositories { mavenCentral() }
    dependencies { classpath 'org.ow2.asm:asm:9.9' }
}

// This is applied by Viro's existing AAR wrapper, outside generated android/.
// Package installs only apply the text hook; compilation happens in Gradle.
def patchDirectory = new File(projectDir, '../../../../../patches/viro-touch')
// Explicit file-content providers also invalidate configuration-cache entries.
// JsonSlurper.parse(File) alone can leave a stale identity in a reused entry.
def patchFile = layout.projectDirectory.file('../../../../../patches/react-viro+3.0.3.json')
def patch = new JsonSlurper().parseText(providers.fileContents(patchFile).asText.get())
def packageFile = layout.projectDirectory.file('../../package.json')
def installed = new JsonSlurper().parseText(providers.fileContents(packageFile).asText.get())
if (installed.version != patch.version) {
    throw new GradleException("ARgala Viro touch patch requires ${patch.version}; review before upgrading.")
}
def originalAarFile = layout.projectDirectory.file('viro_renderer-release.aar')
def originalAar = originalAarFile.asFile
def sha256 = { InputStream stream ->
    def digest = MessageDigest.getInstance('SHA-256')
    byte[] buffer = new byte[65536]
    int count
    while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
    digest.digest().encodeHex().toString()
}
// Check on every configuration, even if generated outputs are up to date/cached.
def archiveHash = MessageDigest.getInstance('SHA-256')
        .digest(providers.fileContents(originalAarFile).asBytes.get()).encodeHex().toString()
if (archiveHash != patch.binaryChecksums[0].sha256) {
    throw new GradleException('ARgala Viro renderer archive mismatch; review the installed binary.')
}

def originalDirectory = layout.buildDirectory.dir('argala-viro/original')
def originalJar = originalDirectory.map { it.file('classes.jar') }
def listenerPath = 'com/viro/core/internal/ViroTouchGestureListener.class'
def surfacePath = 'com/viro/core/ViroViewARCore.class'
def extract = tasks.register('extractArgalaViroRenderer', Sync) {
    inputs.property 'listenerClassSha256', patch.listenerClassSha256
    inputs.property 'surfaceClassSha256', patch.surfaceClassSha256
    from zipTree(originalAar)
    include 'classes.jar'
    into originalDirectory
    doLast {
        new ZipFile(originalJar.get().asFile).withCloseable { jar ->
            def entry = jar.getEntry(listenerPath)
            if (entry == null || jar.getInputStream(entry).withCloseable(sha256) != patch.listenerClassSha256) {
                throw new GradleException('ARgala Viro listener class mismatch; review before compiling.')
            }
            def surface = jar.getEntry(surfacePath)
            if (surface == null || jar.getInputStream(surface).withCloseable(sha256) != patch.surfaceClassSha256) {
                throw new GradleException('ARgala Viro surface class mismatch; review before patching.')
            }
        }
    }
}
def compile = tasks.register('compileArgalaViroTouch', JavaCompile) {
    dependsOn extract
    source new File(patchDirectory, 'src/com/viro/core/internal/ViroTouchGestureListener.java')
    classpath = files(originalJar, providers.provider {
        def android = rootProject.findProject(':app')?.extensions?.findByName('android')
        if (android == null) throw new GradleException('ARgala Viro touch patch needs the app Android boot classpath.')
        android.bootClasspath
    })
    destinationDirectory = layout.buildDirectory.dir('argala-viro/compiled')
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.release = 17
    options.encoding = 'UTF-8'
}
// SurfaceView's window transparency hint can outlive Fabric child-layout changes.
// Keep its real alpha hole and traversal, but conservatively composite the whole
// AR window so later Help/footer pixels are never discarded. Append just this
// override to the pinned class; preserve its constructors, JNI and other methods.
def surfaceDirectory = layout.buildDirectory.dir('argala-viro/surface')
def surfacePatch = tasks.register('patchArgalaViroSurface') {
    dependsOn extract
    inputs.file originalJar
    outputs.file surfaceDirectory.map { it.file(surfacePath) }
    doLast {
        byte[] source
        new ZipFile(originalJar.get().asFile).withCloseable { jar ->
            source = jar.getInputStream(jar.getEntry(surfacePath)).withCloseable { it.readAllBytes() }
        }
        def reader = new ClassReader(source)
        def writer = new ClassWriter(reader, 0)
        // Copy existing methods directly; no renderer method is rewritten.
        reader.accept(new ClassVisitor(Opcodes.ASM9, writer) {
            @Override MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
                if (name == 'gatherTransparentRegion' && descriptor == '(Landroid/graphics/Region;)Z') {
                    throw new GradleException('ARgala Viro surface override already exists; review the class.')
                }
                return super.visitMethod(access, name, descriptor, signature, exceptions)
            }
        }, 0)
        def descriptor = '(Landroid/graphics/Region;)Z'
        def method = writer.visitMethod(Opcodes.ACC_PUBLIC, 'gatherTransparentRegion', descriptor, null, null)
        method.visitCode()
        method.visitVarInsn(Opcodes.ALOAD, 0)
        method.visitVarInsn(Opcodes.ALOAD, 1)
        method.visitMethodInsn(Opcodes.INVOKESPECIAL, reader.superName, 'gatherTransparentRegion', descriptor, false)
        method.visitInsn(Opcodes.POP)
        method.visitVarInsn(Opcodes.ALOAD, 1)
        def done = new Label()
        method.visitJumpInsn(Opcodes.IFNULL, done)
        method.visitVarInsn(Opcodes.ALOAD, 1)
        method.visitMethodInsn(Opcodes.INVOKEVIRTUAL, 'android/graphics/Region', 'setEmpty', '()V', false)
        method.visitLabel(done)
        method.visitFrame(Opcodes.F_SAME, 0, null, 0, null)
        method.visitInsn(Opcodes.ICONST_0)
        method.visitInsn(Opcodes.IRETURN)
        method.visitMaxs(2, 2)
        method.visitEnd()
        def output = surfaceDirectory.get().file(surfacePath).asFile
        output.parentFile.mkdirs()
        output.bytes = writer.toByteArray()
    }
}
// Zip rather than Jar preserves the original manifest and every other entry.
def patchedClasses = tasks.register('packageArgalaViroClasses', Zip) {
    dependsOn compile, surfacePatch
    from({ zipTree(originalJar.get().asFile) }) { exclude listenerPath, surfacePath }
    from surfaceDirectory
    from compile.flatMap { it.destinationDirectory }
    archiveFileName = 'classes.jar'
    destinationDirectory = layout.buildDirectory.dir('argala-viro/patched')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
def patchedRenderer = tasks.register('packageArgalaViroRenderer', Zip) {
    from(zipTree(originalAar)) { exclude 'classes.jar' }
    from patchedClasses.flatMap { it.archiveFile }
    archiveFileName = 'viro_renderer-argala.aar'
    destinationDirectory = layout.buildDirectory.dir('argala-viro')
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
artifacts.add('default', patchedRenderer) {
    type = 'aar'
    builtBy patchedRenderer
}
